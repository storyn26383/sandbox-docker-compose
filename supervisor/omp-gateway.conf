; Copied from omp-session-gateway/examples/supervisor/omp-gateway.conf; only `directory` differs,
; pointing at the omp-session-gateway submodule mount. Keep the rest in sync with that example.
;
; Paths below assume:
;   /home/sandbox/omp-session-gateway  the submodule, prepared by `make init-omp-gateway`
;   /home/sandbox/.omp-gateway         ./.data/omp-gateway, holding config/ and state/
;   /home/sandbox/.omp                 OMP's own directory (collab discovery lives under run/)

[program:omp-gateway]
command=/usr/local/bin/bun apps/gateway/src/cli.ts serve
directory=/home/sandbox/omp-session-gateway
user=sandbox
environment=HOME="/home/sandbox",USER="sandbox",PATH="/usr/local/bin:/usr/bin:/bin",XDG_CONFIG_HOME="/home/sandbox/.omp-gateway/config",XDG_STATE_HOME="/home/sandbox/.omp-gateway/state"
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=15
; Gateway logs carry only event names, numbers and booleans; send them to the container log.
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
