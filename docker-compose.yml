include:
  - path: ./clickhouse/docker-compose.yml
    env_file: .env

services:
  workspace:
    build:
      context: .
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
        GIT_USER_NAME: ${GIT_USER_NAME}
        GIT_USER_EMAIL: ${GIT_USER_EMAIL}
    container_name: sandbox-workspace
    tty: true
    stdin_open: true
    working_dir: /home/sandbox/workspace
    env_file: .env
    environment:
      # Where agents report state to herdr; the host side is herdr-relay.ts, started by `make start`
      HERDR_RELAY_ADDRESS: host.docker.internal:${HERDR_RELAY_PORT:-47123}
    volumes:
      - ./omp:/home/sandbox/.omp
      - ./workspace:/home/sandbox/workspace
      - ./omp-session-gateway:/home/sandbox/omp-session-gateway
      - ./.data/omp-gateway:/home/sandbox/.omp-gateway
    depends_on:
      - mysql
      - redis
      - clickhouse

  mysql:
    image: mysql:8
    container_name: sandbox-mysql
    restart: unless-stopped
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sandbox}
    volumes:
      - ./.data/mysql:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: sandbox-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - ./.data/redis:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sandbox-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 127.0.0.1:20241 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    # Shares workspace's network namespace so the gateway sees tunnel traffic as loopback.
    # Recreate this service whenever workspace is recreated.
    # The process keeps retrying forever after losing the edge, so health is "has an active edge connection";
    # autoheal restarts it when unhealthy. Metrics bind to loopback to stay off the tailnet.
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 30s
    labels:
      autoheal: "true"
    network_mode: "service:workspace"
    depends_on:
      - workspace

  tailscale:
    image: tailscale/tailscale:latest
    container_name: sandbox-tailscale
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTH_KEY}
      TS_HOSTNAME: sandbox
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./.data/tailscale:/var/lib/tailscale
    # Shares workspace's network namespace so tailnet peers reach workspace ports directly.
    # Kernel (TUN) mode keeps 127.0.0.1-bound listeners, including the gateway, off the tailnet.
    # Recreate this service whenever workspace is recreated.
    # Self.Online tracks the control-plane long poll; tailscaled can stay up without it, so autoheal restarts it.
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json --peers=false | grep -q '\"Online\": true'"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 60s
    labels:
      autoheal: "true"
    network_mode: "service:workspace"
    depends_on:
      - workspace

  # Compose never restarts unhealthy containers itself; this restarts those labelled autoheal=true.
  # Restarting a sidecar also rejoins workspace's current network namespace.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: sandbox-autoheal
    restart: unless-stopped
    network_mode: none
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  clickhouse:
    ports: !override []

  clickhouse-testing:
    ports: !override []
