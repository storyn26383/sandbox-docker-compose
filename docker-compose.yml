include:
  - path: ./clickhouse/docker-compose.yml
    env_file: .env

services:
  workspace:
    build:
      context: .
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
        GIT_USER_NAME: ${GIT_USER_NAME}
        GIT_USER_EMAIL: ${GIT_USER_EMAIL}
    container_name: sandbox-workspace
    tty: true
    stdin_open: true
    working_dir: /home/sandbox/workspace
    env_file: .env
    volumes:
      - ./claude:/home/sandbox/.claude
      - ./.data/claude.json:/home/sandbox/.claude.json
      - ./workspace:/home/sandbox/workspace
    depends_on:
      - mysql
      - redis
      - clickhouse

  mysql:
    image: mysql:8
    container_name: sandbox-mysql
    restart: unless-stopped
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sandbox}
    volumes:
      - ./.data/mysql:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: sandbox-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - ./.data/redis:/data

  clickhouse:
    ports: !override []

  clickhouse-testing:
    ports: !override []
