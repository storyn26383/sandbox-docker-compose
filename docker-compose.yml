include:
  - path: ./golden-clickhouse/docker-compose.yml
    env_file: .env

services:
  dev:
    build: ./docker/dev
    container_name: sandbox-dev
    tty: true
    stdin_open: true
    working_dir: /app
    depends_on:
      - mysql
      - redis
      - clickhouse

  mysql:
    image: mysql:8.0
    container_name: sandbox-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sandbox}
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: sandbox-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
