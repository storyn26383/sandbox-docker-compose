include:
  - path: ./golden-clickhouse/docker-compose.yml
    env_file: .env

services:
  dev:
    build: ./docker/dev
    container_name: sandbox-dev
    tty: true
    stdin_open: true
    working_dir: /app
    environment:
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
    ports:
      - "127.0.0.1:${SANDBOX_SSH_PORT:-2222}:22"
    volumes:
      - ${SSH_PUBKEY:-${HOME}/.ssh/id_ed25519.pub}:/root/.ssh/authorized_keys:ro
      - ./claude:/root/.claude
    depends_on:
      - mysql
      - redis
      - clickhouse

  mysql:
    image: mysql:8.0
    container_name: sandbox-mysql
    restart: unless-stopped
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sandbox}
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: sandbox-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis-data:/data

  clickhouse:
    ports: !override []

  clickhouse-testing:
    ports: !override []

volumes:
  mysql-data:
  redis-data:
